[tools]
go = "1.27.2"
updatecli = "0.122.1"

# Dependency Updates

[tasks."dependencies:check"]
description = "Preview Local Dependency Updates"
run = """
GITHUB_TOKEN="$(gh auth token)"
export GITHUB_TOKEN
updatecli pipeline diff --config .updatecli.d --disable-changelog --disable-udash-report --unique-tmp-dir
"""

[tasks."dependencies:update"]
description = "Apply Reviewed Local Dependency Updates"
usage = 'flag "--labels <labels>" help="Select Updatecli groups, such as group:tools"'
run = """
GITHUB_TOKEN="$(gh auth token)"
export GITHUB_TOKEN
set --
if [ -n "${usage_labels:-}" ]; then
  set -- --labels "$usage_labels"
fi
updatecli pipeline apply --config .updatecli.d --disable-changelog --disable-udash-report --unique-tmp-dir "$@"
"""

# Development

[tasks.build]
description = "Build The Tofusort Binary"
run = "go build -o tofusort ./cmd/tofusort"

[tasks.check]
description = "Run All Checks"
depends = ["lint", "test"]
run = """
updatecli manifest validate --config .updatecli.d --disable-templating --strict
unformatted="$(gofmt -l .)"
if [[ -n "$unformatted" ]]; then
  echo "Files require gofmt:"
  echo "$unformatted"
  exit 1
fi
"""

[tasks.cleanup]
description = "Clean Build Artefacts"
run = "rm -f tofusort"

[tasks.fmt]
description = "Format Go Code"
run = "go fmt ./..."

[tasks.install]
description = "Install The Tofusort Binary To The Configured Go Binary Directory"
run = "go install ./cmd/tofusort"

[tasks.lint]
description = "Run Go Vet"
run = "go vet ./..."

[tasks.test]
description = "Run All Tests"
run = "go test -v ./..."
