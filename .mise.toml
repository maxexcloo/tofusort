[tools]
go = "1.27.2"
golangci-lint = "2.14.0"

[tasks.build]
description = "Build The Tofusort Binary"
run = "go build -o tofusort ./cmd/tofusort"

[tasks.check]
description = "Run All Checks"
depends = ["lint", "test"]
run = """
unformatted="$(gofmt -l .)"
if [[ -n "$unformatted" ]]; then
  echo "Files require gofmt:"
  echo "$unformatted"
  exit 1
fi
"""

[tasks.cleanup]
description = "Clean Build Artefacts"
run = "rm -f tofusort"

[tasks.dev]
description = "Development Validation Cycle"
depends = ["check"]

[tasks.fmt]
description = "Format Go Code"
run = "go fmt ./..."

[tasks.install]
description = "Install The Tofusort Binary To GOPATH/bin"
run = "go install ./cmd/tofusort"

[tasks.lint]
description = "Run Linter"
run = "golangci-lint run ./..."

[tasks.test]
description = "Run All Tests"
run = "go test -v ./..."
