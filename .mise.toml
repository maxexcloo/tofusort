[tools]
go = "latest"

# Development
[tasks.build]
run = "go build -o tofusort ./cmd/tofusort"

[tasks.check]
depends = [
  "check:actions",
  "check:mise",
  "check:oxfmt",
  "check:updates",
  "check:whitespace",
  "test",
]
run = """
go vet ./...
unformatted="$(gofmt -l .)"
if [ -n "$unformatted" ]; then
  echo "Files require gofmt:"
  echo "$unformatted"
  exit 1
fi
"""

[tasks.fmt]
depends = ["fmt:mise", "fmt:oxfmt"]
run = "go fmt ./..."

[tasks.test]
run = "go test ./..."
