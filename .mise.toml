[tools]
go = "1.27.2"
golangci-lint = "2.14.0"

[tasks.build]
description = "Build the tofusort binary"
run = "go build -o tofusort ./cmd/tofusort"

[tasks.check]
description = "Run all checks"
depends = ["lint", "test"]
run = """
unformatted="$(gofmt -l .)"
if [[ -n "$unformatted" ]]; then
  echo "Files require gofmt:"
  echo "$unformatted"
  exit 1
fi
"""

[tasks.cleanup]
description = "Clean build artefacts"
run = "rm -f tofusort"

[tasks.dev]
description = "Development validation cycle"
depends = ["check"]

[tasks.fmt]
description = "Format Go code"
run = "go fmt ./..."

[tasks.install]
description = "Install tofusort binary to GOPATH/bin"
run = "go install ./cmd/tofusort"

[tasks.lint]
description = "Run linter"
run = "golangci-lint run ./..."

[tasks.test]
description = "Run all tests"
run = "go test -v ./..."
